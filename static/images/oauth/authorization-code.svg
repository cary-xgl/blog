<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <style>
      .bg { fill: #fbfbfc; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 18px Arial, sans-serif; fill: #222; }
      .label { font: 14px Arial, sans-serif; fill: #555; }
      .line { stroke: #333; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="300"/>

  <rect class="box" x="60" y="70" width="150" height="52"/>
  <rect class="box" x="300" y="70" width="150" height="52"/>
  <rect class="box" x="540" y="70" width="180" height="52"/>
  <rect class="box" x="780" y="70" width="150" height="52"/>

  <text class="title" x="117" y="102">User</text>
  <text class="title" x="346" y="102">Client</text>
  <text class="title" x="575" y="102">Auth Server</text>
  <text class="title" x="807" y="102">Resource API</text>

  <path class="line" d="M210 88 H300"/>
  <text class="label" x="226" y="76">1. Open app</text>

  <path class="line" d="M450 88 H540"/>
  <text class="label" x="462" y="76">2. Redirect for auth</text>

  <path class="line" d="M540 122 H450"/>
  <text class="label" x="474" y="146">3. Return code</text>

  <path class="line" d="M450 188 H540"/>
  <text class="label" x="455" y="176">4. code + client_secret</text>

  <path class="line" d="M540 222 H450"/>
  <text class="label" x="466" y="246">5. access_token</text>

  <path class="line" d="M450 188 H780"/>
  <text class="label" x="595" y="176">6. Use token</text>

  <path class="line" d="M780 222 H450"/>
  <text class="label" x="618" y="246">7. Return resource</text>
</svg>

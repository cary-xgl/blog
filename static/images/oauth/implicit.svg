<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <style>
      .bg { fill: #fbfbfc; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 18px Arial, sans-serif; fill: #222; }
      .label { font: 14px Arial, sans-serif; fill: #555; }
      .line { stroke: #333; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="220"/>

  <rect class="box" x="90" y="80" width="150" height="52"/>
  <rect class="box" x="340" y="80" width="150" height="52"/>
  <rect class="box" x="590" y="80" width="180" height="52"/>

  <text class="title" x="147" y="112">User</text>
  <text class="title" x="386" y="112">Client</text>
  <text class="title" x="625" y="112">Auth Server</text>

  <path class="line" d="M240 96 H340"/>
  <text class="label" x="263" y="84">1. Open app</text>

  <path class="line" d="M490 96 H590"/>
  <text class="label" x="502" y="84">2. Redirect for auth</text>

  <path class="line" d="M590 132 H490"/>
  <text class="label" x="503" y="156">3. Return access_token</text>
</svg>

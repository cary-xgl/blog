<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <style>
      .bg { fill: #fbfbfc; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 18px Arial, sans-serif; fill: #222; }
      .label { font: 14px Arial, sans-serif; fill: #555; }
      .line { stroke: #333; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="220"/>

  <rect class="box" x="120" y="80" width="170" height="52"/>
  <rect class="box" x="410" y="80" width="180" height="52"/>
  <rect class="box" x="710" y="80" width="160" height="52"/>

  <text class="title" x="175" y="112">Client</text>
  <text class="title" x="445" y="112">Auth Server</text>
  <text class="title" x="742" y="112">Resource API</text>

  <path class="line" d="M290 96 H410"/>
  <text class="label" x="305" y="84">1. client_id + secret</text>

  <path class="line" d="M410 132 H290"/>
  <text class="label" x="332" y="156">2. access_token</text>

  <path class="line" d="M290 188 H710"/>
  <text class="label" x="455" y="176">3. use token</text>
</svg>

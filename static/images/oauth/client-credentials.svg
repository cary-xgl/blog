<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs>
    <style>
      .bg { fill: #fbfbfc; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 26px Arial, sans-serif; fill: #222; }
      .label { font: 20px Arial, sans-serif; fill: #444; }
      .line { stroke: #333; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="500"/>
  <rect class="box" x="120" y="70" width="180" height="60"/>
  <rect class="box" x="390" y="70" width="180" height="60"/>
  <rect class="box" x="660" y="70" width="180" height="60"/>
  <text class="title" x="175" y="108">Client</text>
  <text class="title" x="410" y="108">Auth Server</text>
  <text class="title" x="680" y="108">Resource API</text>

  <path class="line" d="M300 220 H390"/>
  <text class="label" x="240" y="250">1. client_id + client_secret</text>

  <path class="line" d="M390 340 H300"/>
  <text class="label" x="325" y="370">2. access_token</text>

  <path class="line" d="M300 430 H660"/>
  <text class="label" x="430" y="460">3. Use token</text>
</svg>

  </defs>
  <rect class="bg" width="960" height="220"/>
  <rect class="box" x="130" y="82" width="170" height="56"/>
  <rect class="box" x="410" y="82" width="180" height="56"/>
  <rect class="box" x="700" y="82" width="160" height="56"/>

{{ define "main" }}
<main>
  <article class="search-page">
    <div class="title">
      <h1 class="title">{{ .Title }}</h1>
    </div>

    {{ with .Content }}
    <section class="body search-intro">
      {{ . }}
    </section>
    {{ end }}

    <section
      class="search-panel"
      data-search-root
      {{ with .OutputFormats.Get "json" }}data-search-index-url="{{ .RelPermalink }}"{{ end }}>
      <label class="search-label" for="search-query">搜索内容</label>
      <input
        id="search-query"
        class="search-input"
        data-search-input
        type="search"
        name="q"
        autocomplete="off"
        spellcheck="false"
        aria-controls="search-results"
        aria-describedby="search-help search-status"
        placeholder="按标题、标签或正文搜索">
      <p id="search-help" class="search-hint">
        可搜索已建立索引的文章内容。按 <kbd>/</kbd> 可快速聚焦到搜索框。
      </p>
      <p id="search-status" class="search-status" data-search-status aria-live="polite">
        正在加载搜索索引...
      </p>
      <ul id="search-results" class="search-results" data-search-results></ul>
    </section>

    <noscript>
      <p class="search-status search-status-error">搜索功能需要启用 JavaScript 才能加载索引并筛选结果。</p>
    </noscript>
  </article>
</main>
{{ $searchJsHash := md5 (readFile "static/js/search.js") }}
<script defer src="{{ absURL (printf "js/search.js?v=%s" $searchJsHash) }}"></script>
{{ end }}

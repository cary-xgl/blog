<script src="{{ "js/mermaid.min.js" | relURL }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.mermaid) return;

    window.mermaid.initialize({
      startOnLoad: true,
      securityLevel: 'loose',
      themeVariables: {
        fontSize: '20px'
      }
    });
  });
</script>

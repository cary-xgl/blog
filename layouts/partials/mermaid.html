<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: 'loose',
    theme: prefersDark ? 'dark' : 'default',
    flowchart: {
      useMaxWidth: true,
      htmlLabels: false,
      curve: 'basis'
    }
  });
</script>
